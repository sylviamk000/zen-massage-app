<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="greenBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E3B2C"/>
      <stop offset="100%" stop-color="#102219"/>
    </linearGradient>
  </defs>

  <!-- Modern Green Squircle Container -->
  <rect width="512" height="512" rx="128" fill="url(#greenBg)"/>

  <!-- Subtle Inner Accent Ring -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="none" stroke="#2D5540" stroke-width="5"/>

  <!-- Modern Pure White Mushroom Silhouette -->
  <g transform="translate(256, 240)">
    <!-- Mushroom Cap -->
    <path d="M 0 -135 Q -145 -135, -155 10 Q -95 35, 0 15 Q 95 35, 155 10 Q 145 -135, 0 -135 Z" fill="#FFFFFF"/>
    
    <!-- Mushroom Stem -->
    <path d="M -45 15 Q -55 110, -35 150 Q 0 165, 35 150 Q 55 110, 45 15 Z" fill="#FFFFFF"/>

    <!-- Minimalist Cutout Details -->
    <circle cx="-52" cy="-55" r="15" fill="url(#greenBg)" opacity="0.88"/>
    <circle cx="48" cy="-42" r="19" fill="url(#greenBg)" opacity="0.88"/>
    <circle cx="0" cy="-88" r="12" fill="url(#greenBg)" opacity="0.88"/>
  </g>
</svg>
